<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Web Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>JARVIS</h1>
            <p>Live Audio Interface</p>
            <div id="status" class="status sleeping">Disconnected</div>
        </div>

        <div class="visualizer-container">
            <div id="visualizer" class="visualizer"></div>
        </div>

        <div class="controls">
            <button id="mic-btn" class="mic-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
            </button>
            <p id="mic-text">Click to Connect</p>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
