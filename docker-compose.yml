version: '3.8'

services:
  jarvis-web:
    build: .
    container_name: jarvis-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Kolkata
      - QT_QPA_PLATFORM=offscreen
    volumes:
      - ./config:/app/config
      - ./plugins:/app/plugins
      - ./logs:/app/logs
